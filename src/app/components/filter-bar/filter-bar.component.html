<div class="filter-bar">
  <div class="filter-tabs">
    <button
      *ngFor="let f of filters"
      class="filter-tab"
      [class.active]="currentFilter === f.value"
      (click)="setFilter(f.value)"
      [id]="'filter-' + f.value"
    >
      {{ f.label }}
      <span class="count-badge">{{ getCount(f.value) }}</span>
    </button>
  </div>

  <div class="sort-group">
    <label class="sort-label" for="sort-select">Сортування:</label>
    <select
      id="sort-select"
      class="sort-select"
      [value]="currentSort"
      (change)="setSort($event)"
    >
      <option *ngFor="let s of sorts" [value]="s.value">{{ s.label }}</option>
    </select>
  </div>
</div>
