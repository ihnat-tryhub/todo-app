<form [formGroup]="form" (ngSubmit)="submit()" class="todo-form">
  <div class="form-header">
    <h2 class="form-title">
      {{ editingTodo ? '✏️ Редагувати завдання' : '➕ Нове завдання' }}
    </h2>
  </div>

  <div class="form-body">
    <div class="input-group">
      <input
        id="todo-title"
        formControlName="title"
        type="text"
        class="todo-input"
        [class.error]="form.get('title')?.invalid && form.get('title')?.touched"
        placeholder="Введіть завдання..."
        autocomplete="off"
      />
      <div class="error-msg" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
        <span *ngIf="form.get('title')?.errors?.['required']">Поле обов'язкове</span>
        <span *ngIf="form.get('title')?.errors?.['minlength']">Мінімум 3 символи</span>
      </div>
    </div>

    <div class="priority-group">
      <label class="priority-label">Пріоритет:</label>
      <div class="priority-buttons">
        <button
          *ngFor="let p of priorities"
          type="button"
          class="priority-btn"
          [class]="'priority-btn ' + p"
          [class.active]="form.get('priority')?.value === p"
          (click)="form.get('priority')?.setValue(p)"
        >
          {{ getPriorityLabel(p) }}
        </button>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        {{ editingTodo ? 'Зберегти' : 'Додати' }}
      </button>
      <button *ngIf="editingTodo" type="button" class="btn btn-cancel" (click)="cancel()">
        Скасувати
      </button>
    </div>
  </div>
</form>
