<div class="todo-item" [class.completed]="todo.completed" [class]="'todo-item priority-' + todo.priority + (todo.completed ? ' completed' : '')">
  <div class="todo-left">
    <button
      class="checkbox"
      [class.checked]="todo.completed"
      (click)="toggle.emit(todo.id)"
      [attr.aria-label]="todo.completed ? 'Позначити як невиконане' : 'Позначити як виконане'"
      [id]="'toggle-' + todo.id"
    >
      <svg *ngIf="todo.completed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
    </button>

    <div class="todo-content">
      <span class="todo-title">{{ todo.title }}</span>
      <span class="priority-badge" [class]="'priority-badge ' + todo.priority">
        {{ getPriorityLabel() }}
      </span>
    </div>
  </div>

  <div class="todo-actions">
    <button
      class="action-btn edit-btn"
      (click)="edit.emit(todo)"
      [id]="'edit-' + todo.id"
      title="Редагувати"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <button
      class="action-btn delete-btn"
      (click)="delete.emit(todo.id)"
      [id]="'delete-' + todo.id"
      title="Видалити"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3,6 5,6 21,6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
    </button>
  </div>
</div>
